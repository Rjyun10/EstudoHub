<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstudoHub - Recuperar Senha</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/root.css" />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px">
      <h3 class="text-center mb-3">Recuperar Senha</h3>
      <p class="text-muted text-center small mb-4">
        Informe seu e-mail cadastrado para receber o link de redefinição.
      </p>

      <form id="formRecuperar">
        <div class="mb-3">
          <label for="emailRecuperar" class="form-label">E-mail</label>
          <input
            type="email"
            class="form-control"
            id="emailRecuperar"
            placeholder="seu@email.com"
            required
          />
        </div>
        <button type="submit" id="btnEnviar" class="btn btn-primary w-100">
          Enviar Link
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="login.html" class="text-decoration-none small"
          >Voltar para o login</a
        >
      </div>
    </div>

    <!-- Scripts do Supabase e lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document
        .getElementById("formRecuperar")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("emailRecuperar").value;
          const btn = document.getElementById("btnEnviar");

          btn.disabled = true;
          btn.textContent = "Enviando...";

          // Define para qual página o usuário vai ao clicar no link do e-mail
          const redirectUrl =
            window.location.origin +
            window.location.pathname.replace(
              "recuperar.html",
              "atualizar-senha.html",
            );

          const { error } = await window._supabase.auth.resetPasswordForEmail(
            email,
            {
              redirectTo: redirectUrl,
            },
          );

          if (error) {
            alert("Erro ao enviar e-mail: " + error.message);
            btn.disabled = false;
            btn.textContent = "Enviar Link";
          } else {
            alert(
              "E-mail de recuperação enviado! Verifique sua caixa de entrada.",
            );
            window.location.replace("login.html");
          }
        });
    </script>
  </body>
</html>
