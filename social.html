<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstudoHub - Comunidade & Ranking</title>
    <!-- Favicon do EstudoHub -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/splash.css" />
    <link rel="stylesheet" href="css/timer.css" />
  </head>
  <body class="bg-light">
    <div
      id="splash-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      "
    >
      <div class="text-center">
        <h1 class="logo-animado fw-bold text-white mb-2">Comunidade</h1>
        <div
          class="spinner-border text-light spinner-border-sm"
          role="status"
        ></div>
      </div>
    </div>
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <main class="container py-4" style="max-width: 900px">
      <!-- Cabeçalho -->
      <div class="text-center mb-4">
        <h2 class="fw-bold">🌐 Comunidade de Estudantes</h2>
        <p class="text-muted">
          Descubra outros estudantes, acompanhe suas metas e troque
          conhecimentos.
        </p>
      </div>

      <!-- Campo de Busca de Usuários -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">🔍</span>
            <input
              type="text"
              id="input-busca-usuario"
              class="form-control border-start-0"
              placeholder="Buscar estudantes por nome ou bio..."
              oninput="window.buscarUsuarios(this.value)"
            />
          </div>
        </div>
      </div>

      <!-- Ranking de Metas e Comunidade -->
      <div class="row g-4">
        <!-- Lista de Estudantes -->
        <div class="col-md-8">
          <h5 class="fw-bold mb-3">Estudantes na Rede</h5>
          <div id="lista-usuarios-container" class="d-flex flex-column gap-3">
            <div class="text-center py-4 text-muted">
              <div
                class="spinner-border spinner-border-sm me-2"
                role="status"
              ></div>
              Carregando estudantes...
            </div>
          </div>
        </div>

        <!-- Painel Lateral: Ranking/Destaques -->
        <div class="col-md-4">
          <div class="card border border-secondary-subtle shadow-sm p-3 mb-3">
            <h6 class="fw-bold text-primary mb-3">🎯 Foco do Dia</h6>
            <p class="small text-muted mb-0">
              Estudantes com metas ativas têm 80% mais consistência em seus
              cadernos. Atualize a sua no seu perfil!
            </p>
          </div>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/splash.js"></script>
    <script src="js/ui-helpers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/widget-timer.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if (typeof window.carregarComunidade === "function") {
          await window.carregarComunidade();
        }
      });
    </script>
  </body>
</html>
