<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstudoHub - Nova Senha</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/root.css" />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px">
      <h3 class="text-center mb-3">Redefinir Senha</h3>
      <p class="text-muted text-center small mb-4">
        Digite sua nova senha abaixo.
      </p>

      <form id="formAtualizarSenha">
        <div class="mb-3">
          <label for="novaSenha" class="form-label">Nova Senha</label>
          <input
            type="password"
            class="form-control"
            id="novaSenha"
            placeholder="Mínimo de 6 caracteres"
            required
            minlength="6"
          />
        </div>
        <button type="submit" id="btnSalvar" class="btn btn-primary w-100">
          Salvar Nova Senha
        </button>
      </form>
    </div>

    <!-- Scripts do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document
        .getElementById("formAtualizarSenha")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const novaSenha = document.getElementById("novaSenha").value;
          const btn = document.getElementById("btnSalvar");

          btn.disabled = true;
          btn.textContent = "Atualizando...";

          // Atualiza a senha do usuário autenticado pelo token do link do e-mail
          const { error } = await window._supabase.auth.updateUser({
            password: novaSenha,
          });

          if (error) {
            alert("Erro ao atualizar senha: " + error.message);
            btn.disabled = false;
            btn.textContent = "Salvar Nova Senha";
          } else {
            alert("Senha alterada com sucesso! Faça login com sua nova senha.");
            window.location.replace("login.html");
          }
        });
    </script>
  </body>
</html>
