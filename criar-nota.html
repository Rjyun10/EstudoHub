<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstudoHub - Publicar Material</title>
    <!-- Favicon do EstudoHub -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/splash.css" />
    <link rel="stylesheet" href="css/timer.css" />
  </head>
  <body class="bg-light">
    <div
      id="splash-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      "
    >
      <div class="text-center">
        <h1 class="logo-animado fw-bold text-white mb-2">Nova Nota</h1>
        <div
          class="spinner-border text-light spinner-border-sm"
          role="status"
        ></div>
      </div>
    </div>
    <!-- NAV DESKTOP (Topo) -->
    <div id="navbar-container"></div>

    <main class="container py-5" style="max-width: 700px">
      <div class="card border border-secondary-subtle shadow-sm rounded-4 p-4">
        <div class="card-body p-4">
          <h3 class="fw-bold mb-3">Nova Publicação</h3>

          <form id="form-criar-nota">
            <div class="mb-3">
              <label class="form-label fw-bold">Título do Material</label>
              <input
                type="text"
                id="nota-titulo"
                class="form-control"
                placeholder="Ex: Resumo de Geometria Analítica"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Matéria / Disciplina</label>
              <input
                type="text"
                id="nota-materia"
                class="form-control"
                placeholder="Ex: Matemática, História, Programação"
                required
              />
            </div>

            <!-- Seleção de Formato -->
            <label class="form-label fw-bold mb-2">Tipo de Conteúdo</label>
            <ul
              class="nav nav-pills nav-justified mb-3"
              id="typeTab"
              role="tablist"
            >
              <li class="nav-item">
                <button
                  class="nav-link active"
                  id="type-text-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#pane-text"
                  type="button"
                >
                  Texto / Anotação
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  id="type-file-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#pane-file"
                  type="button"
                >
                  Anexar PDF ou Imagem
                </button>
              </li>
            </ul>

            <div class="tab-content mb-4" id="typeTabContent">
              <!-- Aba Texto -->
              <div class="tab-pane fade show active" id="pane-text">
                <textarea
                  id="nota-texto"
                  class="form-control"
                  rows="6"
                  placeholder="Escreva aqui suas anotações ou resumo..."
                ></textarea>
              </div>

              <!-- Aba Arquivo -->
              <div class="tab-pane fade" id="pane-file">
                <label class="form-label"
                  >Selecione o arquivo (PDF, JPG ou PNG)</label
                >
                <input
                  type="file"
                  id="nota-arquivo"
                  class="form-control"
                  accept=".pdf,image/*"
                />
                <div class="form-text">
                  Envie fotos das folhas do caderno ou arquivos PDF baixados.
                </div>
              </div>
            </div>

            <button
              type="submit"
              id="btn-salvar"
              class="btn btn-primary w-100 py-2 fw-bold"
            >
              Publicar Material
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/splash.js"></script>
    <script src="js/ui-helpers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/widget-timer.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await verificarSessao();
      });

      document
        .getElementById("form-criar-nota")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          await salvarNovaNota();
        });
    </script>
  </body>
</html>
